name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install forge-std
        if: hashFiles('contracts/lib/forge-std/src/Test.sol') == ''
        run: cd contracts && forge install foundry-rs/forge-std@v1.16.2 --no-git
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
        env:
          CONFORMANCE_CLEAN_CHECKOUT: "1"
      - run: mkdir -p release-artifacts
      - name: Record release metadata
        run: pnpm release:metadata --output release-artifacts/release-metadata.json
      - name: Include conformance record
        run: tar -czf release-artifacts/erc-8350-conformance.tar.gz -C artifacts conformance
      - run: pnpm --dir packages/core pack --pack-destination ../../release-artifacts
      - run: pnpm --dir packages/reference-engine pack --pack-destination ../../release-artifacts
      - run: pnpm --dir packages/awareness-adapter pack --pack-destination ../../release-artifacts
      - run: pnpm --dir implementations/minimal-ts pack --pack-destination ../../release-artifacts
      - name: Package contract sources
        run: >-
          tar -czf release-artifacts/agent-memory-state-contracts.tar.gz
          contracts/src contracts/foundry.toml contracts/remappings.txt
      - name: Package normative specification and vectors
        run: >-
          tar -czf release-artifacts/erc-8350-specification.tar.gz
          erc/erc-8350.md erc/assets/erc-8350 SPEC.md
          test-vectors/v1.json test-vectors/v2.json LICENSE
      - name: Package G4 security evidence
        run: >-
          tar -czf release-artifacts/erc-8350-g4-security-evidence.tar.gz
          audits/g4 SECURITY.md docs/security
      - name: Generate checksums
        run: cd release-artifacts && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: erc-8350-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "ERC-8350 ${GITHUB_REF_NAME#v}" \
              "${prerelease_args[@]}"
          fi
