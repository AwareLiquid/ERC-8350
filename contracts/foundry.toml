[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "../test-vectors" }]
# No external libraries: the reference contracts are dependency-free
# (EIP-712 / ECDSA implemented inline) so the suite builds offline.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# Read from the environment so no endpoint or API key is committed.
# See docs/deployment.md — deployer keys are never stored in this repository.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
